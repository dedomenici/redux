<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var path = location.pathname || "/";
        var match = path.match(/^(?:\/redux)?\/(themound|mound)(\/.*)?$/);
        if (!match) return;
        var rest = match[1] === "mound" ? "/" : match[2] || "/";
        if (rest.charAt(0) !== "/") rest = "/" + rest;
        location.replace("https://dedomenici.github.io/themound" + rest + location.search + location.hash);
      })();
    </script>
    <title>The Redux Project Movie Location Finder</title>
    <meta name="description" content="Search a movie and look at the street where it was filmed." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bungee&family=Outfit:wght@400;600&display=swap"
    />
  </head>
  <body class="bg-bg text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="../src/pages/main.tsx"></script>
    <script data-goatcounter="https://dedomenici.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script>
      (function () {
        function goatcount() {
          if (window.goatcounter && typeof window.goatcounter.count === "function") {
            window.goatcounter.count({ path: location.pathname + location.search + location.hash });
          }
        }
        window.addEventListener("popstate", goatcount);
        var pushState = history.pushState;
        history.pushState = function () {
          var ret = pushState.apply(this, arguments);
          goatcount();
          return ret;
        };
      })();
    </script>
      <script id="gc-events">
    (function () {
      var PREFIX = "redux";
      var queue = [];
      var timer = 0;
      function flush() {
        if (!window.goatcounter || typeof window.goatcounter.count !== "function") return false;
        while (queue.length) window.goatcounter.count(queue.shift());
        return true;
      }
      function send(payload) {
        queue.push(payload);
        if (flush()) return;
        if (timer) return;
        var n = 0;
        timer = setInterval(function () {
          n++;
          if (flush() || n > 40) { clearInterval(timer); timer = 0; }
        }, 250);
      }
      function track(name, title) {
        send({ path: PREFIX + "-click-" + name, title: title || name, event: true });
      }
      window.__gcTrack = track;
      function slug(s) {
        return String(s || "").toLowerCase().replace(/&[^;]+;/g, " ").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "click";
      }
      function labelOf(el) {
        var custom = el.getAttribute("data-goat");
        if (custom) return custom;
        var raw = el.getAttribute("aria-label") || el.getAttribute("title") || el.value || (el.textContent || "");
        return String(raw).replace(/\s+/g, " ").trim().slice(0, 80);
      }
      document.addEventListener("click", function (ev) {
        var t = ev.target;
        if (!t || !t.closest) return;
        var named = t.closest("[data-goat]");
        if (named) {
          track(named.getAttribute("data-goat"), named.getAttribute("data-goat-title") || named.getAttribute("data-goat"));
          return;
        }
        var el = t.closest("button, a, [role='button'], input[type='submit'], input[type='button'], summary");
        if (!el || el.disabled || el.getAttribute("aria-disabled") === "true") return;
        if (el.closest("form") && el.closest("form").querySelector("input[type=password]")) return;
        var label = labelOf(el);
        if (!label) return;
        if (/age\s*\d/i.test(label) || label.length > 60) {
          track("item", "Item");
          return;
        }
        if (el.tagName === "A") {
          var href = el.getAttribute("href") || "";
          if (/^https?:/i.test(href) || (el.host && el.host !== location.host)) {
            try {
              var u = new URL(href, location.href);
              if (u.host && u.host !== location.host) {
                track("external-" + slug(u.hostname), "External: " + u.hostname);
                return;
              }
            } catch (err) {}
          }
        }
        track(slug(label), label);
      }, true);
    })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var path = location.pathname || "/";
        var match = path.match(/^(?:\/redux)?\/(themound|mound)(\/.*)?$/);
        if (!match) return;
        var rest = match[1] === "mound" ? "/" : match[2] || "/";
        if (rest.charAt(0) !== "/") rest = "/" + rest;
        location.replace("https://dedomenici.github.io/themound" + rest + location.search + location.hash);
      })();
    </script>
    <title>The Redux Project Movie Location Finder</title>
    <meta name="description" content="Search a movie and look at the street where it was filmed." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bungee&family=Outfit:wght@400;600&display=swap"
    />
  </head>
  <body class="bg-bg text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="../src/pages/main.tsx"></script>
    <script data-goatcounter="https://dedomenici.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script>
      (function () {
        function goatcount() {
          if (window.goatcounter && typeof window.goatcounter.count === "function") {
            window.goatcounter.count({ path: location.pathname + location.search + location.hash });
          }
        }
        window.addEventListener("popstate", goatcount);
        var pushState = history.pushState;
        history.pushState = function () {
          var ret = pushState.apply(this, arguments);
          goatcount();
          return ret;
        };
      })();
    </script>
  </body>
</html>
